<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Send to Browser - Settings</title>
  <style>
    :root { color-scheme: light dark; --fg: #202124; --muted: #5f6368; --bg: #fff; --box: #f1f3f4; --warn: #fce8e6; --warn-fg: #a50e0e; --accent: #1a73e8; }
    @media (prefers-color-scheme: dark) {
      :root { --fg: #e8eaed; --muted: #9aa0a6; --bg: #202124; --box: #303134; --warn: #5c2b29; --warn-fg: #f6aea9; --accent: #8ab4f8; }
    }
    body { font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 24px; max-width: 520px; color: var(--fg); background: var(--bg); }
    h1 { font-size: 16px; margin: 0 0 4px; }
    .muted { color: var(--muted); }
    .warn { background: var(--warn); color: var(--warn-fg); padding: 10px 12px; border-radius: 6px; margin: 12px 0; }
    .warn code { background: transparent; }
    code { background: var(--box); padding: 1px 4px; border-radius: 3px; }
    fieldset { border: 0; padding: 0; margin: 16px 0 0; }
    label { display: flex; align-items: center; gap: 8px; padding: 4px 0; cursor: pointer; }
    #choose-list { margin: 4px 0 0 26px; }
    #choose-list .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    #choose-list .row label { flex: 1; }
    #choose-list .def { font-size: 12px; color: var(--muted); }
    #choose-list .def input { accent-color: var(--accent); }
    .hint { margin-top: 16px; font-size: 12px; }
  </style>
</head>
<body>
  <h1>Send to Browser</h1>
  <div id="where" class="muted">Detecting…</div>
  <div id="host-warn" class="warn" hidden></div>

  <fieldset>
    <label><input type="radio" name="mode" value="auto"> <span><b>Automatic</b> <span id="auto-desc" class="muted"></span></span></label>
    <label><input type="radio" name="mode" value="choose"> <b>Choose browsers</b></label>
    <div id="choose-list" hidden></div>
  </fieldset>

  <p class="hint muted">One browser = a simple right-click item. Two or more = a submenu. The toolbar button always uses the default.</p>

  <script src="options.js"></script>
</body>
</html>
